<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Clone</title>
    <link rel="icon" type="image/x-icon" href="/images/myntra_logo.webp">
    <link rel="stylesheet" href="index.css">
    <!-- <link rel="stylesheet" href="https://jsdelivr.net"> -->
    <link rel="stylesheet" href="./node_modules/bootstrap-icons/font/bootstrap-icons.css">

</head>
<body>
    <header>
        <div class="logo_container">
            <a href="#">
                <img class="myntra_home" src="images/myntra_logo.webp" alt="Myntra Home">
            </a>
        </div>
        <nav class="nav_bar">
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Home & Living</a>
            <a href="#">Beauty</a>
            <a href="#">Studio <sup>New</sup></a>
        </nav>
        <div class="search_bar">
            <i class="bi bi-search search_icon"></i>
            <input class="search_input" placeholder="Search for products, brands and more!">
        </div>
        <div class="action_bar">
            <div class="action_container">
                <i class="bi bi-person"></i>
                <span class="profile_name">Profile</span>
            </div>
            <div class="action_container">
                <i class="bi bi-heart"></i>
                <span class="wishlist">Wishlist</span>
            </div>
            <div class="action_container">
                <i class="bi bi-bag"></i>
                <span class="bag">Bag</span>
            </div>
        </div>
    </header>
    <main>
        <div class="banner_container">
            Banner Container 
        </div>
        <div class="category_heading">
            Category Heading
        </div>
        <div class="category_items">
            Category Items
        </div>
    </main>
    <footer>Footer</footer>
</body>
</html>
